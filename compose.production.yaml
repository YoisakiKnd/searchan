services:
  caddy:
    image: caddy:2-alpine
    environment:
      SEARCHAN_DOMAIN: ${SEARCHAN_DOMAIN:?Set SEARCHAN_DOMAIN to your public hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      searchan:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy-data:
  caddy-config:
