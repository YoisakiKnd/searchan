name: searchan
services:
  searchan:
    build: .
    env_file: .env
    environment:
      SEARCHAN_DATA_DIR: /data
      SEARCHAN_LISTEN: 0.0.0.0:8090
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - searchan-data:/data
    mem_limit: 384m
    cpus: 2
    pids_limit: 96
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  searchan-data:
